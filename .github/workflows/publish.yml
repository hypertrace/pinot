name: Publish artifacts
on:
# Will only run when release is published. 
  release:
    types: 
      - created
  workflow_dispatch:

jobs:
  publish-artifacts:
    runs-on: ubuntu-22.04
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_PUBLISH_USER }}
          password: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}

      - name: Build Java artifacts
        uses: hypertrace/github-actions/gradle@main
        with:
          args: build copyPlugins :pinot-servicemanager:copyPlugins

      - name: Extract version
        id: extract-version
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push pinot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hypertrace/pinot:${{ steps.extract-version.outputs.VERSION }}

      - name: Build and push pinot-servicemanager image
        uses: docker/build-push-action@v5
        with:
          context: ./pinot-servicemanager
          file: ./pinot-servicemanager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hypertrace/pinot-servicemanager:${{ steps.extract-version.outputs.VERSION }}

  publish-helm-charts:
    needs: publish-artifacts
    runs-on: ubuntu-22.04
    steps:
       # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
   
      - name: package and release charts
        uses: hypertrace/github-actions/helm-gcs-publish@main
        with: 
          helm-gcs-credentials: ${{ secrets.HELM_GCS_CREDENTIALS }}
          helm-gcs-repository: ${{ secrets.HELM_GCS_REPOSITORY }}

  publish-release-notes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: hypertrace/github-actions/release-notes@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
